><div class="stats"><div class="stat"><div class="v" id="sk">0</div><div class="l">kcal</div></div><div class="stat"><div class="v bl" id="sp">0g</div><div class="l">proteina</div></div><div class="stat"><div class="v rd" id="sc">0g</div><div class="l">carbos</div></div><div class="stat"><div class="v am" id="sf">0g</div><div class="l">gordura</div></div></div><div class="prog"><div class="pbar" id="pb" style="width:0%"></div></div><div id="mlist"></div><button class="addbtn" onclick="openR()">+ Adicionar refeicao</button><button class="printbtn" onclick="doPrint()">Imprimir / Salvar PDF</button></div><div id="panel-recipes" class="panel"><input class="srch" type="text" id="srch" placeholder="Buscar receitas..." oninput="renderR()"><div class="frow"><button class="fb on" onclick="setF('all',this)">Todas</button><button class="fb onamber on" id="fcafe" onclick="setF('cafe',this)">Cafe e Lanche</button><button class="fb" onclick="setF('frango',this)">Frango</button><button class="fb" onclick="setF('carne',this)">Carne</button><button class="fb" onclick="setF('peixe',this)">Peixe</button><button class="fb" onclick="setF('veg',this)">Vegetariano</button><button class="fb" onclick="setF('sopa',this)">Sopa</button><button class="fb on" id="fmeta" onclick="toggleMeta(this)">Na meta</button></div><div class="rlist" id="rlist"></div></div><div id="panel-grocery" class="panel"><div id="glist"></div></div></div><div class="modbg" id="modbg" onclick="closeOvl(event)"><div class="modbox"><button class="modclose" onclick="closeMod()">x</button><div id="modbody"></div></div></div><div id="ps"></div><script>var R=[{"title":"Frango Grelhado com Legumes","kcal":"320","time":"30","difficulty":"fácil","protein":"35g","carbs":"18g","fat":"12g","fiber":"4g","ingredients":[{"name":"Peito de frango","qty":"200g"},{"name":"Brócolis","qty":"1 xícara"},{"name":"Cenoura","qty":"1 unidade"},{"name":"Abobrinha","qty":"½ unidade"},{"name":"Azeite e temperos","qty":"1 colher de sopa (13g)"}],"steps":["Tempere o frango com sal, pimenta, alho e ervas.","Grelhe o frango em fogo médio-alto por 6 min de cada lado.","Corte os legumes e cozinhe no vapor por 8 minutos.","Monte as marmitas dividindo frango e legumes.","Congele e descongele na geladeira na véspera."],"freeze":"Pode ser congelada por até 30 dias.","meal_type":"main"},{"title":"Strogonoff de Frango Light","kcal":"280","time":"25","difficulty":"fácil","protein":"30g","carbs":"22g","fat":"8g","fiber":"2g","ingredients":[{"name":"Peito de frango em cubos","qty":"200g"},{"name":"Iogurte natural","qty":"100ml"},{"name":"Molho de tomate","qty":"3 colheres de sopa"},{"name":"Cogumelos fatiados","qty":"½ xícara"},{"name":"Arroz integral","qty":"½ xícara"}],"steps":["Grelhe o frango em cubos até dourar.","Adicione o molho de tomate e os cogumelos.","Cozinhe por 5 minutos e desligue o fogo.","Incorpore o iogurte natural mexendo delicadamente.","Sirva com arroz integral. Para congelar, separe o arroz do strogonoff."],"freeze":"Pode ser congelada por até 21 dias.","meal_type":"main"},{"title":"Escondidinho de Batata Doce","kcal":"310","time":"30","difficulty":"médio","protein":"28g","carbs":"30g","fat":"9g","fiber":"3g","ingredients":[{"name":"Batata doce","qty":"150g"},{"name":"Carne moída magra","qty":"2 unidades médias"},{"name":"Cebola","qty":"½ unidade"},{"name":"Alho","qty":"2 dentes"},{"name":"Queijo ralado light","qty":"2 colheres de sopa (20g)"}],"steps":["Cozinhe a batata doce e amasse como purê.","Refogue a cebola e o alho, adicione a carne moída.","Monte camadas: purê, carne, purê.","Polvilhe queijo ralado por cima.","Asse a 200°C por 15 min ou congele antes de assar."],"freeze":"Pode ser congelada por até 30 dias.","meal_type":"main"},{"title":"Almôndegas de Peru ao Molho","kcal":"260","time":"30","difficulty":"médio","protein":"26g","carbs":"15g","fat":"10g","fiber":"2g","ingredients":[{"name":"Carne de peru moída","qty":"200g"},{"name":"Aveia em flocos","qty":"3 colheres de sopa (30g)"},{"name":"Ovo","qty":"250g"},{"name":"Molho de tomate caseiro","qty":"1 xícara"},{"name":"Salsinha e cebolinha","qty":"a gosto"}],"steps":["Misture a carne de peru, aveia, ovo e temperos.","Modele bolinhas e coloque em assadeira untada.","Asse a 200°C por 15 minutos.","Cubra com molho de tomate e asse mais 5 min.","Divida em porções e congele."],"freeze":"Pode ser congelada por até 21 dias.","meal_type":"main"},{"title":"Quibe de Forno Fit","kcal":"290","time":"30","difficulty":"médio","protein":"24g","carbs":"20g","fat":"13g","fiber":"3g","ingredients":[{"name":"Carne moída magra","qty":"250g"},{"name":"Trigo para quibe","qty":"½ xícara"},{"name":"Cebola ralada","qty":"1 unidade"},{"name":"Hortelã fresca","qty":"¼ xícara"},{"name":"Azeite","qty":"1 colher de sopa (13g)"}],"steps":["Hidrate o trigo em água morna por 30 minutos.","Misture a carne, trigo escorrido, cebola e hortelã.","Tempere com sal, pimenta e noz moscada.","Espalhe em forma untada e regue com azeite.","Asse a 200°C por 25 minutos. Congele em porções."],"freeze":"Pode ser congelada por até 30 dias.","meal_type":"main"},{"title":"Lasanha de Abobrinha","kcal":"270","time":"30","difficulty":"médio","protein":"22g","carbs":"12g","fat":"15g","fiber":"3g","ingredients":[{"name":"Abobrinha grande","qty":"2 unidades (400g)"},{"name":"Carne moída","qty":"150g"},{"name":"Molho de tomate","qty":"2 unidades"},{"name":"Ricota","qty":"100g"},{"name":"Queijo mussarela light","qty":"50g"}],"steps":["Fatie a abobrinha no sentido do comprimento (bem fina).","Refogue a carne moída com temperos e molho de tomate.","Monte camadas: abobrinha, carne, ricota.","Finalize com mussarela por cima.","Asse a 200°C por 20 minutos. Congele em porções."],"freeze":"Pode ser congelada por até 14 dias.","meal_type":"main"},{"title":"Moqueca de Peixe Light","kcal":"240","time":"25","difficulty":"médio","protein":"28g","carbs":"10g","fat":"10g","fiber":"2g","ingredients":[{"name":"Filé de peixe branco","qty":"200g"},{"name":"Leite de coco light","qty":"100ml"},{"name":"Tomate","qty":"2 unidades"},{"name":"Pimentão","qty":"½ unidade"},{"name":"Coentro e dendê","qty":"1 colher de sopa + 1 colher de chá (15g)"}],"steps":["Tempere o peixe com limão, sal e pimenta.","Fatie tomate e pimentão e coloque na panela.","Adicione o peixe por cima dos vegetais.","Despeje o leite de coco e um fio de azeite de dendê.","Cozinhe tampado em fogo baixo por 15 minutos."],"freeze":"Pode ser congelada por até 14 dias.","meal_type":"main"},{"title":"Risoto de Frango e Espinafre","kcal":"300","time":"30","difficulty":"médio","protein":"25g","carbs":"35g","fat":"8g","fiber":"3g","ingredients":[{"name":"Arroz arbóreo","qty":"½ xícara (93g)"},{"name":"Frango desfiado","qty":"150g"},{"name":"Espinafre","qty":"½ xícara"},{"name":"Caldo de legumes","qty":"500ml"},{"name":"Parmesão ralado","qty":"2 colheres de sopa"}],"steps":["Refogue o arroz em um fio de azeite por 2 minutos.","Adicione o caldo de legumes aos poucos, mexendo sempre.","Quando o arroz estiver al dente, adicione o frango e espinafre.","Desligue o fogo e misture o parmesão.","Divida em marmitas e congele."],"freeze":"Pode ser congelada por até 21 dias.","meal_type":"main"},{"title":"Panqueca Salgada Recheada","kcal":"230","time":"25","difficulty":"fácil","protein":"20g","carbs":"22g","fat":"7g","fiber":"2g","ingredients":[{"name":"Farinha de aveia","qty":"½ xícara"},{"name":"Ovo","qty":"1 unidade"},{"name":"Leite desnatado","qty":"100ml"},{"name":"Frango desfiado","qty":"150g"},{"name":"Molho de tomate","qty":"½ xícara"}],"steps":["Bata a farinha, ovo e leite até ter uma massa lisa.","Faça as panquecas finas em frigideira antiaderente.","Recheie com frango desfiado temperado.","Enrole e coloque em travessa, cubra com molho.","Congele em marmitas individuais."],"freeze":"Pode ser congelada por até 14 dias.","meal_type":"main"},{"title":"Arroz Integral com Brócolis e Frango","kcal":"340","time":"25","difficulty":"fácil","protein":"32g","carbs":"30g","fat":"10g","fiber":"4g","ingredients":[{"name":"Arroz integral","qty":"½ xícara (93g)"},{"name":"Peito de frango","qty":"150g"},{"name":"Brócolis","qty":"½ xícara"},{"name":"Shoyu","qty":"1 colher de sopa"},{"name":"Gergelim","qty":"1 colher de chá"}],"steps":["Cozinhe o arroz integral conforme instruções.","Grelhe o frango fatiado com shoyu e alho.","Cozinhe o brócolis no vapor por 5 minutos.","Monte as marmitas com arroz, frango e brócolis.","Finalize com gergelim. Congele em porções."],"freeze":"Pode ser congelada por até 21 dias.","meal_type":"main"},{"title":"Frango ao Curry com Arroz","kcal":"310","time":"30","difficulty":"médio","protein":"30g","carbs":"28g","fat":"10g","fiber":"2g","ingredients":[{"name":"Peito de frango","qty":"150g"},{"name":"Arroz integral","qty":"½ xícara (93g)"},{"name":"Leite de coco light","qty":"100ml"},{"name":"Curry em pó","qty":"1 colher de chá (3g)"}],"steps":["Cozinhe o arroz.","Grelhe o frango e adicione curry e leite de coco.","Monte marmitas. Congele."],"freeze":"Pode ser congelada por até 30 dias.","meal_type":"main"},{"title":"Carne Moída com Abobrinha e Arroz","kcal":"290","time":"25","difficulty":"fácil","protein":"24g","carbs":"26g","fat":"10g","fiber":"3g","ingredients":[{"name":"Carne moída magra","qty":"150g"},{"name":"Abobrinha","qty":"1 unidade"},{"name":"Arroz integral","qty":"½ xícara"},{"name":"Temperos","qty":"a gosto"}],"steps":["Cozinhe arroz.","Refogue carne moída com temperos.","Corte e refogue abobrinha.","Monte marmitas."],"freeze":"Pode ser congelada por até 30 dias.","meal_type":"main"},{"title":"Filé de Tilápia com Purê de Batata Doce","kcal":"280","time":"30","difficulty":"médio","protein":"28g","carbs":"24g","fat":"8g","fiber":"3g","ingredients":[{"name":"Filé de tilápia","qty":"150g"},{"name":"Batata doce","qty":"150g"},{"name":"Limão","qty":"½ unidade (30g)"},{"name":"Sal e ervas","qty":"1 pitada cada (2g)"}],"steps":["Tempere o peixe com limão e ervas.","Asse a 200°C por 15 min.","Faça purê de batata doce.","Monte marmitas."]," function gG(n,q,p){
  if(!q||q==="a gosto")return null;
  q=q.trim();
  if(/^\d+g$/.test(q))return Math.round(parseInt(q)*p)+"g";
  if(/^\d+ml$/.test(q))return Math.round(parseInt(q)*p)+"ml";
  var map={"xcara":160,"1 xcara":160,"meia xcara":80,"1/2 xcara":80,"1 colher de sopa":15,"2 colheres de sopa":30,"3 colheres de sopa":45,"1 colher de cha":5,"1 unidade":120,"2 unidades":240,"1 lata":170,"100ml":100,"200ml":200,"50ml":50};
  var k=q.toLowerCase().replace(/[áàã]/g,"a").replace(/[éê]/g,"e").replace(/[íî]/g,"i").replace(/[óô]/g,"o").replace(/[ú]/g,"u").replace(/½/g,"1/2");
  if(map[k])return "~"+Math.round(map[k]*p)+"g";
  return null;
}
function pN(s){return parseInt((s||"0").replace(/[^0-9]/g,""))||0;}

  var c=meals.reduce(function(a,m){return a+Math.round(pN(m.carbs)*(m.por||1));},0);
  var f=meals.reduce(function(a,m){return a+Math.round(pN(m.fat)*(m.por||1));},0);
  document.getElementById("sk").textContent=k;
  document.getElementById("sp").textContent=p+"g";
  document.getElementById("sc").textContent=c+"g";
  document.getElementById("sf").textContent=f+"g";

function catOk(r,cat){
  if(cat==="all")return true;
  if(cat==="cafe")return r.meal_type==="cafe";
  var t=r.title.toLowerCase();
  if(cat==="frango")return t.indexOf("frango")>=0||t.indexOf("galinhada")>=0;
  if(cat==="carne")return t.indexOf("carne")>=0||t.indexOf("bife")>=0||t.indexOf("kafta")>=0||t.indexOf("quibe")>=0;
  if(cat==="peixe")return t.indexOf("tilap")>=0||t.indexOf("salm")>=0||t.indexOf("peixe")>=0||t.indexOf("atum")>=0||t.indexOf("moq")>=0;
  if(cat==="veg")return t.indexOf("frango")<0&&t.indexOf("carne")<0&&t.indexOf("peixe")<0&&t.indexOf("tilap")<0&&t.indexOf("salm")<0&&t.indexOf("atum")<0&&t.indexOf("peru")<0;
  if(cat==="sopa")return t.indexOf("sopa")>=0||t.indexOf("caldeirada")>=0;
  return true;
}
